<div class="quantum-card p-4 partition-demo" id="partition-demo"
     data-manifest="{{ url_for('static', filename='image/partition-steps/manifest.json') }}"
     data-assets="{{ url_for('static', filename='image/partition-steps/') }}">
  <div class="partition-heading">
    <h4>分区算法演示</h4>
    <span class="partition-qubits">27 量子比特</span>
  </div>
  <div class="mb-4">
    <div class="form-label" id="algorithm-choice-label">选择分区算法</div>
    <div class="algorithm-choices" role="group" aria-labelledby="algorithm-choice-label">
      <button type="button" class="algo-btn active" data-algo="gsp" aria-pressed="true">
        <span class="algorithm-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M8 8v16m16-16v16M8 8l16 16M8 24L24 8"/><path class="icon-divider" d="M16 3v26"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="24" r="3"/><circle cx="24" cy="8" r="3"/><circle cx="24" cy="24" r="3"/></svg>
        </span>
        <span class="algorithm-name">GSP<span class="algorithm-caption">图划分</span></span>
        <span class="algorithm-selected" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 8 3 3 5-6"/></svg></span>
      </button>
      <button type="button" class="algo-btn" data-algo="qhsp" aria-pressed="false">
        <span class="algorithm-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect x="7" y="7" width="18" height="18" rx="4"/><path d="M12 3v4m8-4v4M12 25v4m8-4v4M3 12h4m-4 8h4m18-8h4m-4 8h4M11 17h3l2-5 3 9 2-5"/></svg>
        </span>
        <span class="algorithm-name">QHSP<span class="algorithm-caption">硬件感知</span></span>
        <span class="algorithm-selected" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 8 3 3 5-6"/></svg></span>
      </button>
      <button type="button" class="algo-btn" data-algo="dqp" aria-pressed="false">
        <span class="algorithm-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M7 12a10 10 0 0 1 17-3l2 3m0-6v6h-6M25 20A10 10 0 0 1 8 23l-2-3m0 6v-6h6M12 16h8"/><circle cx="11" cy="16" r="2.5"/><circle cx="21" cy="16" r="2.5"/></svg>
        </span>
        <span class="algorithm-name">DQP<span class="algorithm-caption">动态分区</span></span>
        <span class="algorithm-selected" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 8 3 3 5-6"/></svg></span>
      </button>
    </div>
  </div>
  <div class="mb-3">
    <label for="topology-select" class="form-label">量子硬件拓扑</label>
    <select id="topology-select" class="form-select">
      <option value="linear">线性拓扑</option>
      <option value="grid">网格拓扑</option>
      <option value="ibmq">IBMQ拓扑</option>
      <option value="custom">自定义拓扑</option>
    </select>
  </div>
  <div class="partition-player" aria-busy="true">
    <div class="partition-viewport">
      <img id="partition-frame" src="{{ url_for('static', filename='image/partition-steps/gsp_linear/00.webp') }}"
           width="1327" height="801" alt="GSP 线性拓扑：初始状态" draggable="false">
    </div>
    <div class="partition-transport">
      <div class="partition-status-row">
        <span id="partition-mode" class="partition-mode">分步演示</span>
        <span id="partition-status" role="status" aria-live="polite">正在加载演示…</span>
      </div>
      <div id="partition-timeline" class="partition-timeline">
        <label class="visually-hidden" for="partition-step">选择演示步骤</label>
        <div class="partition-step-track">
          <div class="partition-step-markers" aria-hidden="true"></div>
          <input type="range" id="partition-step" min="0" max="5" value="0" step="1" disabled>
        </div>
        <div class="partition-step-labels" aria-hidden="true"><span>初始状态</span><span>演示完成</span></div>
      </div>
      <div class="partition-playback-controls" role="group" aria-label="分区演示播放控制">
        <button type="button" id="partition-prev" class="partition-control" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg><span>上一步</span>
        </button>
        <button type="button" id="partition-play" class="partition-control partition-play" aria-pressed="false" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path class="play-symbol" d="m7 4 9 6-9 6Z"/><path class="pause-symbol" d="M6 4v12M14 4v12"/></svg><span>自动播放</span>
        </button>
        <button type="button" id="partition-next" class="partition-control" disabled>
          <span>下一步</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg>
        </button>
      </div>
      <div class="partition-secondary-controls">
        <button type="button" id="partition-reset" class="partition-reset" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6 6 0 1 1 0 5M4 3v5h5"/></svg>重新开始
        </button>
        <label class="partition-speed-label" for="partition-speed">播放速度
          <select id="partition-speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        </label>
      </div>
    </div>
  </div>
  <div class="partition-step-note">
    <strong id="partition-step-title">初始拓扑</strong>
    <p id="partition-step-description">可逐步观察分区过程，也可选择自动播放。</p>
    <button type="button" id="partition-retry" class="partition-control" hidden>重新加载演示</button>
  </div>
  <div class="mt-3">
    <button type="button" id="algorithm-info" class="btn btn-outline-primary"><i class="fas fa-info-circle" aria-hidden="true"></i> 算法说明</button>
  </div>
</div>
